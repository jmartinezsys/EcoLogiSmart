<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión sostenible de recursos, economía circular y logística compartida.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EcoLogiSmart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EcoLogiSmart</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #f5f7f3; }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f5f7f3;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }
    #app-loading img { width: 128px; height: 188px; object-fit: contain; }
    #app-loading.app-loading-hidden { opacity: 0; pointer-events: none; }
    #app-loading-message {
      margin: 12px 24px 0;
      color: #52665a;
      font: 500 14px/1.5 Arial, sans-serif;
      text-align: center;
    }
    #app-loading-retry {
      display: none;
      margin-top: 12px;
      padding: 10px 18px;
      color: #fff;
      background: #173e35;
      border: 0;
      border-radius: 12px;
      font: 600 14px Arial, sans-serif;
    }
    #app-loading.app-loading-error #app-loading-retry { display: inline-flex; }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Cargando EcoLogiSmart">
    <img src="branding/ecologismart_isotipo.png" alt="EcoLogiSmart">
    <p id="app-loading-message">Iniciando la aplicación…</p>
    <button id="app-loading-retry" type="button" onclick="window.location.reload()">Reintentar</button>
  </div>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
